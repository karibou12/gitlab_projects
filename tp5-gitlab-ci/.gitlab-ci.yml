stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------------------------
# STAGE 1 : BUILD ET PUSH DES IMAGES (FRONTEND & BACKEND)
# ------------------------------------------------------------------
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - set -e
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    
    # Build & Push FRONTEND
    - echo "1. Build & Push Frontend..."
    - docker build -f dockerfile_frontend -t "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/frontend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

    # Build & Push BACKEND
    - echo "2. Build & Push Backend..."
    - docker build -f dockerfile_backend -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/backend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"


# ------------------------------------------------------------------
# STAGE 2 : DÉPLOIEMENT SSH SUR SERVEUR DISTANT
# ------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $TARGET_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - set -e
    # Envoi du compose.yml sur le serveur
    - scp compose.yml $TARGET_SERVER_USER@$TARGET_SERVER_IP:~/app/compose.yml

    # Exécution sur le serveur distant
    - |
      ssh $TARGET_SERVER_USER@$TARGET_SERVER_IP "
        cd ~/app
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        
        export CI_REGISTRY_IMAGE='$CI_REGISTRY_IMAGE'
        export IMAGE_TAG='$IMAGE_TAG'
        
        docker compose pull
        docker compose up -d --remove-orphans
        docker image prune -f
      "
  only:
    - main
